name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_INSTAGRAM_ELFSIGHT_APP_ID: ${{ secrets.INSTAGRAM_ELFSIGHT_APP_ID }}
          VITE_INSTAGRAM_WIDGET_URL: ${{ secrets.INSTAGRAM_WIDGET_URL }}
          VITE_DIRECTORY_SHEET_ID: ${{ secrets.VITE_DIRECTORY_SHEET_ID }}
          VITE_SERVICES_SHEET_ID: ${{ secrets.VITE_SERVICES_SHEET_ID }}
          VITE_NETWORKING_SHEET_ID: ${{ secrets.VITE_NETWORKING_SHEET_ID || '1z37lsb3N9VAqIxgRMdPYrqVOm61bt6KltjJpsD_FIrw' }}
          VITE_KITF_SUBMIT_URL: ${{ secrets.VITE_KITF_SUBMIT_URL }}
          VITE_KITF_SUBMIT_SECRET: ${{ secrets.VITE_KITF_SUBMIT_SECRET }}
          VITE_KITF_LIBRARY_SHEET_ID: ${{ secrets.VITE_KITF_LIBRARY_SHEET_ID }}
          VITE_PROPERTY_ENQUIRY_SUBMIT_URL: ${{ secrets.VITE_PROPERTY_ENQUIRY_SUBMIT_URL }}
          VITE_PROPERTY_ENQUIRY_SECRET: ${{ secrets.VITE_PROPERTY_ENQUIRY_SECRET }}
          VITE_WINE_ORDER_SUBMIT_URL: ${{ secrets.VITE_WINE_ORDER_SUBMIT_URL }}
          VITE_WINE_ORDER_SECRET: ${{ secrets.VITE_WINE_ORDER_SECRET }}
          VITE_DONATION_LINK: ${{ secrets.VITE_DONATION_LINK }}
          VITE_VOLUNTEER_SIGNUP_URL: ${{ secrets.VITE_VOLUNTEER_SIGNUP_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
